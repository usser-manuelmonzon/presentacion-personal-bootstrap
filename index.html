<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Presentación personal | Manuel Monzón</title>

    <!-- Bootstrap 5 mediante CDN -->

    <link rel="stylesheet" href="assets/css/style.css">

                <a class="navbar-brand fw-bold" href="#inicio">

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir menú de navegación"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a
                                class="nav-link active"
                                aria-current="page"
                                href="#inicio"

                        <li class="nav-item">
                            <a class="nav-link" href="#biografia">

                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#habilidades">
                                Habilidades
                            </a>
                        </li>

                        <li class="nav-item">

                    <div class="col-md-8">

                            Manuel Alexander Monzón Palma

                        </p>

                    <div class="col-md-4 text-center mt-4 mt-md-0">
                        <img
                            src="assets/img/ManuelMonzonFoto.png"

                    </div>

                </div>

            </div>
        </section>

    </header>

    <!-- JavaScript de Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
